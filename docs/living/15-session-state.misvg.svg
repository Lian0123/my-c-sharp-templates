  <title>UML Session 與 Refresh family 狀態</title>
  <desc>繁體中文 Agent living document。Markdown 是內容權威；UML 關係、資料來源與更新規則以原生靜態 SVG 呈現。</desc>
  <metadata>
    <m:document version="0.1" profile="static" doc-id="urn:uuid:74e3208f-569c-48bd-9664-abea27ef00f6" revision="6">
      <m:source media-type="text/markdown" dialect="commonmark-0.31.2" xml:space="preserve"># UML Session 與 Refresh family 狀態

視圖：state
文件編號：DOC-15
文件狀態：current
核准狀態：not-recorded
維護角色：技術／測試維護角色（待具名確認）
具名負責人：unassigned
適用基準：referenced-source-sha256；驗證以紀錄快照為準
最後審查：2026-11-08
關聯需求：REQ-AUTH-001,REQ-CMS-001
關聯決策：ADR-AUTH-001
範圍：依現有實作說明功能與關聯；不冒認本次已執行業務驗收。

## 節點

### initial | «initial» 尚未建立 Session

### valid | «state» 有效且未撤銷 Session

- 進入：Login 或另一個 Session 的 Refresh 產生新 Session。
- 有效條件：User Active、Verified、安全版本相符；未撤銷且未過期。
- 不變條件：一個 Session Id 的生命週期；輪替新 ID 是另一個實例。

### revoked | «state» 已撤銷 Session

- 判定：RevokedAt 非 null；涵蓋輪替、登出、密碼與管理異動。
- 不變條件：原 Session 不會恢復；舊 Refresh 重用可影響同 family 其他 Session。
- 限制：原因是流程語意，資料表沒有獨立狀態或撤銷原因 enum。

### expired | «state» 未撤銷但已過期

- 判定：RevokedAt 為 null 且 ExpiresAt &lt;= Now。
- 不變條件：Refresh 不延長該 Session 原期限；過期 Session 不再授權。
- 限制：JWT 本身期限另行驗證；不以 JWT 過期改寫資料列。

## 關係

- transition | initial | valid | Login [有效且已驗證] 或另一個 Session 的合法 Refresh / CreateSession。
- transition | valid | revoked | Refresh 成功／Logout／Reset／管理異動 [提交成功] / 設定 RevokedAt；Refresh 另建新 Session，不是恢復舊實例。
- transition | valid | expired | 時間推進 [RevokedAt 為 null 且 ExpiresAt &lt;= Now] / 後續查驗拒絕。
- transition | revoked | revoked | 舊 Refresh 重用 [原期限未到且 CSRF 合法] / 撤銷同 family 的其他有效 Session；本列仍撤銷。
- transition | expired | expired | Refresh [已過期] / 401；不另觸發 family 重用分支。

## 準則

- 圖表示單一 Session Id 的生命週期；Refresh 的新 ID 是另一個實例，不畫出原 Session 復活。
- Auth 無法查驗時回 503 是請求結果，不是持久化 Session 狀態；恢復後仍須完整權威查驗。
- revoked 與 expired 分類依上面 guard；狀態由欄位推導，不宣稱程式存在 enum。
- JWT 五分鐘期限與 Session 七天上限分開驗證；Redis 只快取撤銷結果，MQ 不決定授權。

## 來源

- src/Services/Auth/Auth.Domain/Identity.cs
- src/Services/Auth/Auth.Infrastructure/AuthService.cs
- src/Shared/BuildingBlocks/Platform.cs
</m:source>
