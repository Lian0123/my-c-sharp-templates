  <metadata>
    <m:document version="0.1" profile="static" doc-id="urn:uuid:c9b961e4-a538-467e-9109-a2dfa853a66f" revision="3">
      <m:source media-type="text/markdown" dialect="commonmark-0.31.2" xml:space="preserve"># 附件狀態、私有儲存與清理流程

視圖：cards
範圍：以 Attachment.Ready／MessageId 推導的狀態；程式沒有獨立 AttachmentState enum。
讀圖：transition 為有條件的生命週期轉移；association 為資料或存取關聯。

## 節點

### pending | «state» Pending

- 資料庫已有 Attachment 列；Ready = false
- MessageId = null；已先保存 ObjectKey
- 此時 S3 寫入可能尚未成功，不可綁定訊息

### ready | «state» Ready／Unbound

- Garage Put 成功後保存 Ready = true
- MessageId = null；檔案尚未綁定
- 未滿 24 小時且權限符合時才可綁定

### bound | «state» Bound

- Ready = true；MessageId != null
- 在 Send 交易內與 ChatMessage 綁定
- 每則最多五個；同一附件不可重複或再次綁定

### removed | «state» Expired／Removed

- 未綁定且 CreatedAt 早於 24 小時
- Cleanup 每 10 分鐘取最多 100 筆並列鎖
- 先刪 Garage 物件，再刪 DB 列；失敗稍後重試

### garage | «storage» Garage S3

- 私有 attachments bucket
- ObjectKey = uploads/{attachmentId:N}
- 只由 Message 持有 S3 存取設定；不公開物件網址

### download | «operation» Authorized Download

- GET /api/v1/chat/attachments/{id}
- 每次驗證 Session 與房間／管理員權限
- 綁定訊息已刪除時，一般會員不可下載

## 關係

- transition | pending | ready | S3 Put 成功並保存 Ready；若進程中斷則保留 Pending 供清理
- transition | ready | bound | Send 鎖房間並檢查 owner、room、Ready、未綁定與未逾時
- transition | pending | removed | MessageId 為 null 且已超過 24 小時；清理可回收上傳中斷紀錄
- transition | ready | removed | MessageId 為 null 且已超過 24 小時；清理未使用物件
- association | pending | garage | 先保存 DB 待完成紀錄，再寫入物件，降低無法追蹤的孤兒檔案
- call | download | garage | Message 授權後串流下載；不發出可繞過撤銷的公開下載網址

## 準則

- 每檔最多 20 MiB；允許 JPEG、PNG、WebP、PDF 與 UTF-8 文字；空檔、格式偽造及危險檔名須拒絕。
- 圖片單邊最多 8192 像素且總量最多 1600 萬像素；使用解碼檢查，不只信任 MIME 或副檔名。
- 已綁定附件不由未綁定清理流程刪除；訊息刪除採軟刪除與稽核，不應畫成即刻刪除 S3。
- Attachment.MessageId、OwnerId 是邏輯參照；RoomId 才是這個模型已設定的資料庫 FK。

## 來源

- src/Services/Message/Message.Domain/Chat.cs
- src/Services/Message/Message.Infrastructure/ChatService.cs
- src/Services/Message/Message.Infrastructure/ObjectStorage.cs
- src/Services/Message/Message.Infrastructure/AttachmentCleanup.cs
- src/Services/Message/Message.Infrastructure/MessageDbContext.cs
