      <line x1="325" y1="1761" x2="1125" y2="1761" stroke="#2863D8" stroke-width="2" />
      <polyline points="1113,1754 1125,1761 1113,1768" fill="none" stroke="#2863D8" stroke-width="2" />
    </g>
    <g id="section-54">
      <text x="56" y="1827" font-size="25" fill="#183048" font-weight="bold"><tspan x="56" y="1827">準則</tspan></text>
    </g>
    <g id="line-56">
      <text x="70" y="1869" font-size="18" fill="#52677C"><tspan x="70" y="1869">每檔最多 20 MiB；允許 JPEG、PNG、WebP、PDF 與 UTF-8 文字；空檔、格式偽造及危險檔名須拒絕。</tspan></text>
    </g>
    <g id="line-57">
      <text x="70" y="1911" font-size="18" fill="#52677C"><tspan x="70" y="1911">圖片單邊最多 8192 像素且總量最多 1600 萬像素；使用解碼檢查，不只信任 MIME 或副檔名。</tspan></text>
    </g>
    <g id="line-58">
      <text x="70" y="1953" font-size="18" fill="#52677C"><tspan x="70" y="1953">已綁定附件不由未綁定清理流程刪除；訊息刪除採軟刪除與稽核，不應畫成即刻刪除 S3。</tspan></text>
    </g>
    <g id="line-59">
      <text x="70" y="1995" font-size="18" fill="#52677C"><tspan x="70" y="1995">Attachment.MessageId、OwnerId 是邏輯參照；RoomId 才是這個模型已設定的資料庫 FK。</tspan></text>
    </g>
