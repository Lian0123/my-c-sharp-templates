    <m:document version="0.1" profile="static" doc-id="urn:uuid:30aed66d-d592-437b-9e5d-5d57f06ae7d2" revision="3">
      <m:source media-type="text/markdown" dialect="commonmark-0.31.2" xml:space="preserve"># Account 與跨服務資料投影

視圖：cards
範圍：身分、公開資料與聊天室使用者之間，以相同 UserId／Id 建立的跨庫邏輯對應。
讀圖：event 為事件驅動投影；相同 ID 不是跨庫 FK，也不授權跨服務查詢資料庫。

## 節點

### identity | «authority» Auth.User

- User.Id：跨服務使用者識別碼
- Active／EmailVerified／Role／SecurityVersion 由 Auth 決定
- InitialDisplayName 是註冊時名稱，非持續同步的個人資料權威

### profile | «entity» Account.Profile

- PK Id = Auth.User.Id（事件建立）
- DisplayName 最大 50；Bio 最大 500
- Active／IdentityVersion 為身分投影
- Version : long concurrency token；更新後遞增
- CreatedAt；資料表 Profiles

### chatuser | «projection» Message.ChatUser

- PK Id = UserId；資料表 Users（Message DB）
- DisplayName／Active：服務所需的最小資料
- ProfileVersion／IdentityVersion 分開追蹤
- 不保存密碼、Refresh Token、Email 驗證 Token

### cache | «cache» Account Redis

- account:profile:{userId}
- ProfileView 快取 30 秒；更新／事件時失效
- Redis 故障或 JSON 損毀時回源 Account PostgreSQL

### inbox | «technical» Inbox／Outbox

- Inbox.Id = EventId；ProcessedAt
- Profile 更新與 account.profile.changed.v1 Outbox 同交易
- 事件重複由 Inbox 去重；舊版本由 Handler 忽略

## 關係

- event | identity | profile | auth.identity.changed.v1：新建 Profile 或更新 Active／IdentityVersion
- event | identity | chatuser | auth.identity.changed.v1：更新 IdentityVersion／Active；無個人資料時補初始名稱
- event | profile | chatuser | account.profile.changed.v1：更新 ProfileVersion／DisplayName；只在沒有身分版本時補 Active
- association | profile | cache | 唯讀快取，不是資料所有權或授權依據
- association | profile | inbox | Consumer 在同交易提交投影、Inbox 與新的 Outbox

## 準則

- Profile.IdentityVersion 與 Profile.Version 含意不同；ChatUser 的兩個版本也必須獨立比較。
- Account 不消費 ProfileChanged；Auth 不消費 ProfileChanged。不要畫出不存在的反向同步。
- Account /me 在投影尚未建立時回傳 202、Retry-After: 2；前端等待初始化完成才開放編輯。
- 公開個人資料搜尋只回傳 Active 的有限筆結果；CMS 目前載入最新最多 100 筆帳號，並非全域統計。

## 來源

- src/Shared/Contracts/IntegrationEvents.cs
- src/Services/Account/Account.Domain/Profile.cs
- src/Services/Account/Account.Infrastructure/AccountDbContext.cs
- src/Services/Account/Account.Infrastructure/AccountService.cs
- src/Services/Account/Account.Api/Program.cs
- src/Services/Message/Message.Infrastructure/MessageIntegrationHandler.cs
- src/Web/src/App.tsx
- src/Web/src/AdminPage.tsx
