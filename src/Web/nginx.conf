log_format safe_json escape=json '{"service":"Web","method":"$request_method","path":"$uri","status":$status,"bytes":$body_bytes_sent}';
access_log /var/log/nginx/access.log safe_json;
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  add_header X-Content-Type-Options nosniff always;
  location /assets/ { try_files $uri =404; expires 1y; add_header Cache-Control "public, immutable"; }
  location / { try_files $uri $uri/ /index.html; add_header Cache-Control "no-cache"; }
}
