services:
  backend-tests:
    image: mcr.microsoft.com/dotnet/sdk:10.0.403
    working_dir: /workspace
    environment:
      RUN_INTEGRATION: "1"
      TEST_CONTAINER_DNS: "1"
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
    volumes:
      - .:/workspace
      - test-nuget:/root/.nuget/packages
    networks: [app, auth-data, account-data, message-data]
    command: ["sh", "-c", "dotnet restore MicroserviceStarter.slnx --locked-mode && dotnet test tests/MicroserviceStarter.Tests -c Release --no-restore --collect:'XPlat Code Coverage' --settings coverage.runsettings --results-directory artifacts/backend --logger 'trx;LogFileName=backend.trx'"]
  web-tests:
    image: node:24.22.2-bookworm-slim
    working_dir: /workspace/src/Web
    volumes:
      - .:/workspace
      - test-node:/workspace/src/Web/node_modules
    command: ["sh", "-c", "npm ci && npm run lint && npm run build && npm run coverage"]
  e2e-tests:
    image: mcr.microsoft.com/playwright:v1.64.1-noble
    working_dir: /workspace/src/Web
    shm_size: 1gb
    environment:
      BASE_URL: http://gateway:8080
      MAILPIT_URL: http://mailpit:8025
      E2E_ADMIN_EMAIL: ${BOOTSTRAP_EMAIL:?}
      E2E_ADMIN_PASSWORD: ${BOOTSTRAP_PASSWORD:?}
    volumes:
      - .:/workspace
      - test-node:/workspace/src/Web/node_modules
    networks: [app]
    command: ["npm", "run", "e2e"]
  ops:
    build: {context: tools/Operations}
    environment:
      RABBITMQ_URL: amqp://starter:${RABBITMQ_PASSWORD:?}@rabbitmq:5672/
    networks: [app]
volumes:
  test-nuget: {}
  test-node: {}
